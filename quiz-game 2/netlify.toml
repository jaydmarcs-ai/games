[build]
  publish = "public"
  functions = "netlify/functions"

# The host screen lives at /host
[[redirects]]
  from = "/host"
  to = "/host.html"
  status = 200

# The host's picture page lives at /images
[[redirects]]
  from = "/images"
  to = "/images.html"
  status = 200

# The host's question editor lives at /questions
[[redirects]]
  from = "/questions"
  to = "/questions.html"
  status = 200
